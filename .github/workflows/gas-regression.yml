name: GAS Tools Checks

on:
  push:
    branches: [master, main]
    paths:
      - 'Source/**'
      - 'Nexus.uproject'
      - 'Config/**'
      - 'Plugins/**'
      - 'Script/gas*.py'
      - 'Script/tests/test_gas*.py'
      - 'Tests/GasRetest/**'
      - '.github/workflows/gas-regression.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixed cases, baselines and archive failure handling
        run: python -m unittest discover -s Script/tests -p 'test_gas*.py'
      - name: Validate replay and baseline comparison
        working-directory: Plugins/NexusLink/tools
        run: python -m unittest gas_retest.test_runner gas_retest.test_report gas_retest.test_compare
