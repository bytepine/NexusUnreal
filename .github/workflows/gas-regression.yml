name: GAS Tools Checks

on:
  push:
    branches: [master, main]
    paths:
      - 'Source/**'
      - 'Nexus.uproject'
      - 'Config/**'
      - 'Plugins/**'
      - 'Script/**'
      - 'Tests/_framework/**'
      - 'Tests/conftest.py'
      - 'Tests/requirements.txt'
      - 'Tests/GasRetest/**'
      - '.github/workflows/gas-regression.yml'
      - '.github/workflows/ue-validation.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gas-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tools-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r Tests/requirements.txt
      - name: Validate host scripts without an engine
        run: python -m pytest -q Script/tests
      - name: Validate replay and baseline comparison
        working-directory: Plugins/NexusLink/tools
        run: python -m unittest gas_retest.test_runner gas_retest.test_report gas_retest.test_compare
